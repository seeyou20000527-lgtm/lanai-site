name: build-pages

on:
  push:
    branches: [data]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/build-static.mjs
      - name: Commit docs
        run: |
          git config user.name "lanai-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A docs
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "静态站自动重建 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin main
          fi
